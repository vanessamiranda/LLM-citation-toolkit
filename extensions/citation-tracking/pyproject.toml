[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-optimizer-citation-tracker"
version = "0.1.0"
description = "AI citation tracking extension for GEO Optimizer Skill"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Vanessa Miranda" }
]

dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0"
]

[project.urls]
Homepage = "https://github.com/vanessamiranda/geo-optimizer-skill"
Repository = "https://github.com/vanessamiranda/geo-optimizer-skill"
Issues = "https://github.com/vanessamiranda/geo-optimizer-skill/issues"

[tool.setuptools.packages.find]
where = ["src"]
